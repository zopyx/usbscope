[project]
name = "usbscope"
version = "0.1.0"
description = "Pretty macOS CLI to inspect USB buses, USB-C ports, cables and negotiated link modes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["rich>=13.9"]

[project.scripts]
usbscope = "usbscope.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ty>=0.0.21", "ruff>=0.14.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usbscope"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
# the UI intentionally uses the en dash as "not present" glyph
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]
# plist/JSON payloads of the OS are dynamically typed by nature
"src/usbscope/sources/*.py" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
python-version = "3.14"
