[project]
name = "usbscope"
version = "0.4.0"
description = "Pretty macOS CLI and native app to inspect USB buses, USB-C ports, cables and link modes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["rich>=13.9"]

[project.optional-dependencies]
# native macOS UI (usbscope-app); the CLI does not need it
macapp = [
    "pyobjc-framework-Cocoa>=12.2",
    "pyobjc-framework-UserNotifications>=12.2",  # banner on device connect/disconnect
]

[project.scripts]
usbscope = "usbscope.cli:main"
usbscope-app = "usbscope.macapp.launch:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ty>=0.0.21",
    "ruff>=0.14.5",
    "pyobjc-framework-Cocoa>=12.2",
    "pyobjc-framework-UserNotifications>=12.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usbscope"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
# the UI intentionally uses the en dash as "not present" glyph
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]
# plist/JSON payloads of the OS are dynamically typed by nature
"src/usbscope/sources/*.py" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# PyObjC ships no type stubs, so the AppKit/Foundation/objc symbols are unknown to
# the checker; the UI module is excluded from those two rules instead of being
# littered with casts. Everything else (including its own signatures) is checked.
[[tool.ty.overrides]]
include = [
  "src/usbscope/macapp/app.py",
  "src/usbscope/macapp/menubar.py",
  "src/usbscope/macapp/preferences.py",
  "tests/test_macapp_app.py",
  "tests/test_macapp_menubar.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[tool.ty.environment]
python-version = "3.14"
