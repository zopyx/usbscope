# usbscope CI — Apple Silicon macOS only
#
# What runs: on every push to `main` and on every pull request, on an arm64
# macOS runner (`macos-14`, Apple Silicon — the platform this tool targets),
# the build and the test suite run as one step each, so a failure names the gate
# that broke instead of one anonymous "check" step.
#
# The project is Swift only: there is no Python environment to sync and no
# virtualenv to cache. `swift test` covers the parsing/formatting logic, the JSON
# shape against the frozen golden, the presentation layer and the SwiftUI rows.
# Tests that need the live IORegistry (the backend comparison, the timing
# comparison) skip themselves on a runner where it cannot be read — that is not a
# regression.
#
# The bundle step is main-only: it compiles a release build and assembles
# `dist/usbscope-swift.app`. A pull request does not need to pay for that on every
# commit.
#
# Action versions are pinned to the exact released tags that were verified with
# `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name`:
#   actions/checkout          v7.0.1
#   actions/upload-artifact   v7.0.1

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: build + test
    # arm64 macOS. `macos-14` still ships Swift 5.10, which cannot read a
    # `swift-tools-version: 6.0` manifest, so the runner has to be macos-15 or
    # newer. The deployment target stays macOS 14.4 (see Package.swift) — this only
    # picks the toolchain that builds it.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          # The manifest needs Swift 6; fail with a readable message instead of a
          # cryptic manifest error if a runner ever regresses.
          swift --version | grep -qE "Swift version 6" || {
            echo "::error::this package needs Swift 6 (swift-tools-version: 6.0)"
            exit 1
          }

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the app bundle (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/build-swift-app.sh

      - name: Upload the app bundle (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: usbscope-swift-app
          path: dist/usbscope-swift.app
          if-no-files-found: error
