# Credentialed direct-distribution release. Ordinary CI never needs signing
# secrets; this workflow runs only for a version tag or an explicit dispatch.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notarized-app:
    name: Developer ID + notarized app
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun notarytool --version

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPER_ID_CERTIFICATE_BASE64" || {
            echo "::error::DEVELOPER_ID_CERTIFICATE_BASE64 is not configured"
            exit 2
          }
          keychain="$RUNNER_TEMP/usbscope-release.keychain-db"
          security create-keychain -p "$DEVELOPER_ID_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$DEVELOPER_ID_CERTIFICATE_PASSWORD" "$keychain"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$DEVELOPER_ID_CERTIFICATE_PASSWORD" "$keychain"

      - name: Store notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID" -a -n "$APPLE_TEAM_ID" -a -n "$APPLE_APP_PASSWORD" || {
            echo "::error::APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD are required"
            exit 2
          }
          xcrun notarytool store-credentials USBSCOPE_NOTARY \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build, notarize, staple, and validate
        env:
          DEVELOPER_IDENTITY: ${{ secrets.DEVELOPER_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPER_IDENTITY" || {
            echo "::error::DEVELOPER_IDENTITY is not configured"
            exit 2
          }
          scripts/build-swift-app.sh \
            --universal \
            --signing-mode developer-id \
            --identity "$DEVELOPER_IDENTITY" \
            --notarize --notary-profile USBSCOPE_NOTARY
          xcrun stapler validate dist/usbscope-swift.app
          spctl --assess --type execute --verbose=4 dist/usbscope-swift.app

      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::release tag must look like v0.9.0: $tag"; exit 2 ;;
          esac
          gh release create "$tag" \
            dist/usbscope-swift-*.tar.gz dist/SHA256SUMS \
            --title "$tag" --generate-notes
