# Credentialed Mac App Store package validation. This is deliberately manual:
# Apple-issued certificates, a provisioning profile, and a store environment
# are required, and the resulting package is uploaded for human submission.
name: Mac App Store package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build and validate MAS package
    runs-on: macos-15
    timeout-minutes: 45
    environment: app-store
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          productbuild --version

      - name: Import Apple signing certificates
        env:
          MAS_CERTIFICATE_BASE64: ${{ secrets.MAS_CERTIFICATE_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAS_CERTIFICATE_BASE64" -a -n "$MAS_INSTALLER_CERTIFICATE_BASE64" || {
            echo "::error::MAS signing certificate secrets are not configured"
            exit 2
          }
          keychain="$RUNNER_TEMP/usbscope-mas.keychain-db"
          security create-keychain -p "$MAS_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MAS_CERTIFICATE_PASSWORD" "$keychain"
          printf '%s' "$MAS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-app.p12"
          printf '%s' "$MAS_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-installer.p12"
          security import "$RUNNER_TEMP/mas-app.p12" \
            -k "$keychain" -P "$MAS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/mas-installer.p12" \
            -k "$keychain" -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$MAS_CERTIFICATE_PASSWORD" "$keychain"

      - name: Materialize provisioning profile
        env:
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MAS_PROFILE_BASE64" || {
            echo "::error::MAS_PROFILE_BASE64 is not configured"
            exit 2
          }
          printf '%s' "$MAS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/usbscope.provisionprofile"

      - name: Build and validate package
        env:
          MAS_APP_IDENTITY: ${{ secrets.MAS_APP_IDENTITY }}
          MAS_INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MAS_APP_IDENTITY" -a -n "$MAS_INSTALLER_IDENTITY" || {
            echo "::error::MAS_APP_IDENTITY and MAS_INSTALLER_IDENTITY are required"
            exit 2
          }
          scripts/build-swift-mas-pkg.sh \
            --profile "$RUNNER_TEMP/usbscope.provisionprofile" \
            --app-identity "$MAS_APP_IDENTITY" \
            --installer-identity "$MAS_INSTALLER_IDENTITY"

      - name: Upload package for App Store Connect submission
        uses: actions/upload-artifact@v7.0.1
        with:
          name: usbscope-mas-${{ inputs.tag }}
          path: |
            dist/usbscope-*-mas.pkg
            dist/usbscope-swift.app
          if-no-files-found: error

